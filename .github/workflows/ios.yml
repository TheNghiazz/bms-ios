name: ios
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Swift unit tests (golden vectors)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: swift test
        run: swift test

  build-ipa:
    name: Build unsigned IPA (iOS)
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate xcodeproj
        run: xcodegen generate
      - name: Build (unsigned, device)
        run: |
          xcodebuild -project BMSMonitor.xcodeproj \
            -scheme BMSMonitor \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BMSMonitor.app" Payload/
          zip -qry BMSMonitor.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BMSMonitor-unsigned-ipa
          path: BMSMonitor.ipa
